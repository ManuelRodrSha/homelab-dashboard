services:
  backend:
    build:
      context: ./backend
    container_name: homelab-backend
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
    container_name: homelab-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
